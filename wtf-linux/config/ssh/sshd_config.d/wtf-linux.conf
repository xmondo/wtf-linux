# WTF Linux OpenSSH Server defaults
# Installed to /etc/ssh/sshd_config.d/wtf-linux.conf
#
# These are secure defaults applied on top of the Debian openssh-server
# base configuration. Modify as needed after installation.

# Disable root login (use sudo)
PermitRootLogin no

# Allow password authentication (disable after setting up keys)
PasswordAuthentication yes

# Enable pubkey authentication
PubkeyAuthentication yes

# Disable empty passwords
PermitEmptyPasswords no

# Limit authentication attempts
MaxAuthTries 5

# Display last login
PrintLastLog yes

# Keep alive for client connections
ClientAliveInterval 300
ClientAliveCountMax 3
